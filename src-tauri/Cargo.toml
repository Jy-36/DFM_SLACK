[package]
name = "dfm-slack"
version = "0.15.0"
description = "DFM Slack — 업무 도구 모음 (WorkTime 등)"
edition = "2021"

[lib]
name = "dfm_slack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
