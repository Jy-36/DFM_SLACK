# main 브랜치에 올릴 때마다 Windows 설치 파일(.msi, .exe)을 만들어 Releases에 올린다.
# 같은 버전으로 다시 빌드하면 그 버전의 Release를 새 파일로 교체한다.
name: Windows 설치 파일 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 패키지 설치
        run: npm install

      - name: 정산 계산 테스트
        run: node scripts/engine-check.mjs

      - name: 같은 버전의 이전 Release 지우기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete "v$VERSION" --cleanup-tag -y || true

      - name: Tauri 빌드 및 Release 업로드
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DFM Slack v__VERSION__'
          releaseBody: |
            설치: 아래 Assets에서 `.msi`(또는 `-setup.exe`)를 받아 실행하세요.
            커밋: ${{ github.sha }}
          releaseDraft: false
          prerelease: false

      - name: 빌드 결과 보관 (Actions 탭에서도 받을 수 있게)
        uses: actions/upload-artifact@v4
        with:
          name: DFM-Slack-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
