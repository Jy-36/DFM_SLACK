# main 브랜치에 올릴 때마다 Windows 설치 파일(.msi, .exe)을 만들어 Releases에 올린다.
# 같은 버전으로 다시 빌드하면 그 버전의 Release를 새 파일로 교체한다.
name: Windows 설치 파일 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 패키지 설치
        run: npm install

      - name: 정산 계산 테스트
        run: node scripts/engine-check.mjs

      - name: Tauri 빌드
        run: |
          set -o pipefail
          npm run tauri build 2>&1 | tee build.log

      - name: 빌드 오류 요약 (실패했을 때)
        if: failure()
        run: |
          # 오류 줄과 그 뒤 몇 줄을 모아 annotation으로 남긴다 (로그 파일을 못 받는 환경에서도 원인을 볼 수 있게)
          if [ -f build.log ]; then
            grep -n -E "error(\[E[0-9]+\])?:|^\s+--> |^\s+\|\s|warning: unused|Error|failed" build.log | head -120 > err.txt || true
            split -l 25 err.txt part_ || true
            for f in part_*; do
              msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=build log ($f)::$msg"
            done
            tail -40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::error title=build log tail::{}"
          fi

      - name: Release 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete "v$VERSION" --cleanup-tag -y || true
          shopt -s nullglob
          FILES=(src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe)
          gh release create "v$VERSION" "${FILES[@]}" \
            --title "DFM Slack v$VERSION" \
            --notes "설치: 아래 Assets에서 .msi (또는 -setup.exe)를 받아 실행하세요. 커밋 ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"

      - name: 빌드 결과 보관 (Actions 탭에서도 받을 수 있게)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DFM-Slack-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
